[package]
name = "taptap"
version = "2.0.0"
description = "Lightweight Rust + Tauri spatial surround acoustic companion for keyboard and mouse"
authors = ["Taptap Team"]
license = "MIT"
edition = "2021"

[[bin]]
name = "taptap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav", "mp3"] }
fastrand = "2"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_Graphics_Gdi",
] }

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
